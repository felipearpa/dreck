[project]
name = "dreck"
version = "0.1.0"
description = "Scores each function's complexity, coverage and CRAP, worst first, with its location."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "tree-sitter-language-pack==1.25.2",
]

[project.scripts]
dreck = "dreck.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
